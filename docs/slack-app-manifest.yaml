# Paste at https://api.slack.com/apps -> Create New App -> From an app manifest.
# Replace hawk-bot.example.org with PUBLIC_URL everywhere it appears.
#
# This is a SEPARATE Slack app from Hawk Mod. They share a workspace and a
# host, nothing else: different credentials, different scopes, different
# database. Do not add hawk-bot's command to Hawk Mod's manifest.
#
# The icon is not part of a manifest and has to be uploaded by hand, once:
# Basic Information -> Display Information -> App icon, with
# assets/hawk-bot-icon-512.png. Slack keeps it across later manifest edits.
display_information:
  name: Hawk Bot
  description: Team assistant for Red Hawk Robotics
  long_description: >-
    Hawk Bot is FRC 2713's team assistant in Slack. It answers slash commands,
    keeps a small amount of workspace configuration, and posts what the coaches
    ask it to post. It acts only as itself: it holds no permission to read
    anyone's direct messages, and requests no user tokens.
  background_color: "#ba0c2f"

features:
  bot_user:
    display_name: Hawk Bot
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /hawkbot
      url: https://hawk-bot.example.org/slack/events
      description: Team assistant — help, status, settings, attendance
      usage_hint: help | status | whoami | config | report | event
      should_escape: true

oauth_config:
  redirect_urls:
    - https://hawk-bot.example.org/slack/oauth_redirect
    # Sign in with Slack (OpenID Connect) for the web configuration page —
    # see src/web/routes.ts and ADR-0015.
    - https://hawk-bot.example.org/auth/slack/callback
  scopes:
    # Keep identical to BOT_SCOPES in src/slack/app.ts.
    bot:
      - commands
      - chat:write
      # Posts to a public channel the bot has not been invited to.
      - chat:write.public
      - app_mentions:read
      - im:write
      # Resolves whether someone is a workspace Owner, the fallback half of
      # the HawkBot Admin authorization model.
      - users:read
      - team:read
      - channels:read
      - groups:read
      # Attendance Tracking: reactions on an Event Check-in Post, thread
      # replies for the Attendance Note, and the season CSV export DM.
      - reactions:read
      - reactions:write
      # Self-joins a public announce_channel before reacting — chat:write.public
      # covers posting there without an invite, but reactions do not.
      - channels:join
      - channels:history
      - groups:history
      - files:write
      # Confirms a season export CSV actually landed in the admin's DM —
      # files.uploadV2's own response can't be trusted for that (see
      # commands/report.ts, confirmDelivered).
      - im:history
      # HawkBot Admin: resolving admin_usergroup's handle to a group id, and
      # reading that group's membership — the other half of the
      # authorization model, alongside the Owner check above.
      - usergroups:read
    # These are Sign in with Slack's OpenID Connect identity scopes, NOT user
    # token scopes — the deliberate, sole exception to "no user scopes". The
    # token they yield can call openid.connect.userInfo ("who is this
    # person") and nothing else: no messages, no acting on anyone's behalf.
    # It is used for that one call during web sign-in and discarded, never
    # stored. See ADR-0015. Keep identical to OIDC_SCOPES in
    # src/web/routes.ts.
    user:
      - openid
      - profile

settings:
  interactivity:
    is_enabled: true
    request_url: https://hawk-bot.example.org/slack/events
  event_subscriptions:
    request_url: https://hawk-bot.example.org/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - app_uninstalled
      # Attendance Tracking: live reaction tracking and the nudge, and
      # capturing thread replies as an Attendance Note.
      - reaction_added
      - reaction_removed
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
