     the container mount an assets directory. Change one, change the other.

     hawk-bot-icon-512.png next to this file is what gets uploaded to Slack —
     a manifest cannot carry an icon. Re-render it after any edit here:
       qlmanage -t -s 512 -o . hawk-bot-icon.svg && mv hawk-bot-icon.svg.png hawk-bot-icon-512.png -->
