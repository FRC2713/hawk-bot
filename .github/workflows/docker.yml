name: Publish container

# Build and smoke test run alongside CI; only the push waits for it.
# The steps live in FRC2713/hawk_suite/.github/workflows/publish-app.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  # GitHub checks both calls against every job in publish-app.yml, so both
  # allow packages: write. Each job there narrows its own token; only the push
  # stage can write.
  build:
    uses: FRC2713/hawk_suite/.github/workflows/publish-app.yml@main
    permissions:
      contents: read
      packages: write
    with:
      app: hawk-bot
      stage: build
  push:
    needs: [verify, build]
    uses: FRC2713/hawk_suite/.github/workflows/publish-app.yml@main
    permissions:
      contents: read
      packages: write
    with:
      app: hawk-bot
      stage: push
