name: CI

on:
  push:
    branches: [main]
  workflow_call:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same pin as the Dockerfile: match the npm major that writes the
      # committed lockfile, so `npm ci` never calls it out of sync.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: hawk-candidate:pr
          build-args: APP_REVISION=${{ github.sha }}
      - name: Verify fresh startup and prior-release upgrade
        env:
          IMAGE: hawk-candidate:pr
          BASELINE_IMAGE: ghcr.io/frc2713/hawk-bot:latest
        run: |
          bash scripts/smoke-image.sh
          bash scripts/smoke-upgrade.sh
